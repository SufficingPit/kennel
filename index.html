<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kennel">
<meta name="theme-color" content="#111418">
<script>
// Appearance is per phone: dark unless this phone picked Light or Match phone
(function(){ var t = 'dark'; try { t = localStorage.getItem('kennel-theme') || 'dark'; } catch(e){}
  var dark = t==='dark' || (t==='auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  if(t!=='auto') document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = dark ? '#111418' : '#F7F7F5'; })();
</script>
<title>Kennel</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#F7F7F5;--card:#fff;--ink:#1F2937;--mut:#5B6472;--line:#DDDDD6;--row:#EFEFEA;--pri:#0F766E;--pri-soft:#E3F2EF;--onp:#fff;--bad:#B91C1C;--warnbg:#FEF3C7;--warnfg:#78350F;--field:#C9CBC3;--shade:rgba(120,120,120,.16);--shadow:0 1px 2px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1B2027;--ink:#E5E7EB;--mut:#A3ACB9;--line:#2E353F;--row:#171B21;--pri:#3BAE9F;--pri-soft:#173A36;--onp:#06201C;--bad:#F87171;--warnbg:#3A2E0B;--warnfg:#FCD34D;--field:#3A424D;--shade:rgba(0,0,0,.35);--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1B2027;--ink:#E5E7EB;--mut:#A3ACB9;--line:#2E353F;--row:#171B21;--pri:#3BAE9F;--pri-soft:#173A36;--onp:#06201C;--bad:#F87171;--warnbg:#3A2E0B;--warnfg:#FCD34D;--field:#3A424D;--shade:rgba(0,0,0,.35);--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;min-height:100dvh;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1{font-size:19px;margin:0;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
.top .mid{text-align:center;flex:1;min-width:0}
.pad{padding:0 16px}
.hdr{padding:16px 16px 10px;min-height:64px}
.hdr h1{font-size:22px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.b{min-height:46px;padding:0 20px;border:0;border-radius:12px;background:var(--pri);color:var(--onp);font-weight:600}
.b2{min-height:46px;padding:0 16px;border:1px solid var(--field);border-radius:12px;background:var(--card);color:var(--ink);font-weight:600}
.bd{background:#C62828;color:#fff}
.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.lk{min-height:40px;border:0;background:none;color:var(--pri);font-weight:600;padding:0 6px}
.lk.bad{color:var(--bad)}
.ic{min-width:44px;min-height:44px;border:0;background:none;font-size:24px;line-height:1;color:var(--ink)}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:block;box-shadow:var(--shadow)}
button.card{width:100%;border:0;text-align:left}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.docrow{display:flex;align-items:center;gap:10px;min-height:48px}
.stepr{display:flex;align-items:center;gap:10px}
.stv{min-width:120px;text-align:center;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pgrid button{position:relative;padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:var(--card)}
.pgrid button.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .pck{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:12px;background:var(--pri);color:var(--onp);display:grid;place-items:center}
.pgrid .pcap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;color:#fff;font-size:11px;font-weight:600;line-height:1.2;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.65));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill{padding:4px 14px}
.bl-row{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink);font:inherit}
.bl-row small{display:block;color:var(--mut);font-size:12px}
.bl-row b{font-variant-numeric:tabular-nums}
.bl-row.waived>span:first-child,.bl-row.waived b{opacity:.55}
.bl-row.waived b{text-decoration:line-through}
.bl-total{border-bottom:0;font-size:17px}
.bl-total b{font-size:18px}
.docimg{display:block;width:100%;border-radius:10px;border:1px solid var(--line);background:#fff;margin:4px 0 12px}
.row.start{justify-content:flex-start}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}
.sec{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.05em;margin:22px 0 8px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec .lk{text-transform:none;letter-spacing:0;font-size:14px;min-height:32px}
/* 16px on fields stops iOS Safari zooming in on focus */
input,textarea{width:100%;min-width:0;min-height:46px;border:1px solid var(--field);border-radius:10px;padding:0 12px;background:var(--card);font-size:16px}
input:focus,textarea:focus,.fld:focus-visible{outline:2px solid var(--pri);outline-offset:-1px;border-color:var(--pri)}
textarea{padding:10px 12px;min-height:72px;resize:vertical}
input[type=date]{-webkit-appearance:none;appearance:none;height:46px;line-height:44px;text-align:left}
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--pri);flex:none;margin:0}
.f{display:block;margin-bottom:12px}
.telw{position:relative}
.telw input{padding-right:48px}
.telw .call{position:absolute;right:4px;top:4px;width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--pri-soft);color:var(--pri)}
.telw .call svg{width:18px;height:18px}
.row>.f{flex:1;min-width:0}
.f>.lbl{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px}
/* a "field button": looks like an input, opens a picker */
.fld{width:100%;min-height:46px;border:1px solid var(--field);border-radius:10px;padding:0 12px;background:var(--card);font-size:16px;text-align:left;display:flex;align-items:center;gap:8px}
.fld .v{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld .ph{color:var(--mut)}
.fld .chev{color:var(--mut);font-size:13px;flex:none}
.fld .sub{color:var(--mut);font-size:13px}
.chk-row{display:flex;align-items:center;gap:10px;min-height:44px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--field);background:var(--card);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onp)}
a.chip{text-decoration:none;color:var(--ink)}
.chip.add{border-style:dashed;color:var(--pri);border-color:var(--pri)}
.tchip{padding:0;gap:0;overflow:hidden}
.tchip>button{border:0;background:none;min-height:36px;padding:0 6px 0 14px;font-weight:600}
.tchip>.cx{padding:0 12px 0 6px;color:var(--mut);font-size:18px}
.seg{display:flex;border:1px solid var(--field);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;min-height:40px;border:0;background:none;font-weight:600;font-size:14px;color:var(--mut)}
.seg button+button{border-left:1px solid var(--field)}
.seg button.on{background:var(--pri);color:var(--onp)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;min-height:58px;border:0;background:none;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs svg{width:22px;height:22px}
.tabs .on{color:var(--pri)}
.tabs .newtab{color:var(--pri);order:-1}   /* first: far left on a phone, top of the side menu on a computer */
.bdg{position:absolute;top:-6px;right:-12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-sizing:border-box}
.tabs .newtab .plus{width:34px;height:26px;border-radius:13px;background:var(--pri);color:var(--onp);font-size:22px;line-height:25px;font-weight:600;display:block}
/* while typing, sheet buttons stop floating over the keyboard and just sit at the end */
body.typing .sh>.ft{position:static;border-top:0}
/* computer screens: tabs become a rail on the left, the calendar and Today use the
   width, lists stay at a readable width, and sheets open as centered dialogs */
@media (min-width:900px){
  body{padding-left:92px}
  #app{max-width:760px;padding-bottom:32px}
  #app[data-tab=cal],#app[data-tab=today]{max-width:1400px;padding:0 12px 32px}
  #app[data-tab=signin]{max-width:560px}
  body:has(#app[data-tab=signin]){padding-left:0}
  .tabs{top:0;bottom:0;right:auto;width:92px;max-width:none;margin:0;flex-direction:column;justify-content:flex-start;gap:4px;padding:14px 0;border-top:0;border-right:1px solid var(--line)}
  .tabs button{flex:none;min-height:68px;border-radius:12px;margin:0 8px}
  .tabs button:hover{background:var(--row)}
  .tabs .newtab{order:-1;margin-bottom:10px}
  .kr{height:48px}
  .kseg{max-width:480px;margin-left:auto;margin-right:auto}
  .ov{align-items:center;padding:24px}
  .sh{max-width:620px;max-height:88vh;border-radius:18px;padding:0 22px}
  .sh>.ft{padding-bottom:16px}
  button.card:hover,.pitem:hover{outline:1px solid var(--field)}
  .chip:hover,.b2:hover{border-color:var(--mut)}
}
/* week grid */
.wk{position:relative}
.wh{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:4}
.lab{width:46px;flex:none}
.wh button{flex:1;min-width:0;border:0;background:none;padding:4px 0;font-size:11px;min-height:46px;color:var(--mut)}
.wh button b{display:block;font-size:15px;color:var(--ink)}
.wh button.td b{display:block;margin:0 auto;width:26px;height:26px;line-height:26px;border-radius:13px;background:var(--pri);color:var(--onp)}
.kr{display:flex;height:44px}
.kr:nth-child(even){background:var(--row)}
.kr .lab{font-size:12px;font-weight:600;color:var(--mut);padding-left:10px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.cagerow .lab{color:var(--pri)}
.lane{flex:1;position:relative;display:flex;min-width:0}
.lane>.cell{flex:1;min-width:0;border:0;border-left:1px solid var(--line);background:none;padding:0}
.bar{position:absolute;top:4px;height:24px;z-index:2;border:0;border-radius:6px;padding:0 6px;color:#fff;font-size:11px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:24px}
.bar.late{outline:2px dashed var(--bad);outline-offset:1px}
.trk{position:absolute;top:31px;height:8px;border-radius:3px;z-index:2;pointer-events:none}
.pip{position:absolute;top:31px;height:8px;width:2px;margin-left:-1px;border-radius:1px;z-index:3;pointer-events:none}
.pip.done{opacity:.3}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.9);margin-left:4px;vertical-align:middle}
.ovl{position:absolute;top:0;bottom:0;left:46px;right:0;pointer-events:none;z-index:1}
.lg{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--mut);padding:12px 8px 4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;flex:none}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.ov.pk{z-index:30;background:rgba(0,0,0,.35)}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding:0 16px;display:flex;flex-direction:column}
.sh>.hd{position:sticky;top:0;background:var(--bg);z-index:3;margin:0 -16px;padding:14px 16px 10px;display:flex;align-items:center;gap:8px}
.sh>.hd h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh>.hd .ic{margin-right:-10px}
.sh>.sb{flex:1}
.sh>.ft{flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);z-index:3;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);margin:8px -16px 0}
.sh>.ft .b{flex:1}
.sh>.ft.only-pad{border-top:0;padding-top:0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--field);margin:8px auto 0;flex:none}
.st{border-left:6px solid var(--line)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--bg)}
.colors .on{border-color:var(--ink)}
.chk{width:44px;height:44px;border:2px solid var(--field);border-radius:10px;background:var(--card);font-size:22px;color:var(--onp);flex:none}
.chk.on{background:var(--pri);border-color:var(--pri)}
.warn{background:var(--warnbg);color:var(--warnfg);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.err{color:var(--bad);font-size:14px;font-weight:600;flex-basis:100%;order:-1}
.steps{display:flex;flex-wrap:wrap;align-items:center;list-style:none;margin:-4px 0 14px;padding:0;font-size:13px;color:var(--mut);row-gap:2px}
.steps li{display:flex;align-items:center;min-height:30px}
.steps li+li::before{content:'›';margin:0 8px;color:var(--mut)}
.steps .n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:700;margin-right:5px}
.steps .on{color:var(--ink);font-weight:700}
.steps .on .n{background:var(--pri);border-color:var(--pri);color:#fff}
.steps button{background:none;border:0;padding:0;font:inherit;color:var(--pri);cursor:pointer;display:flex;align-items:center;min-height:30px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--row);color:var(--mut);margin-left:6px;vertical-align:1px;white-space:nowrap}
.pill.bad{background:var(--bad);color:#fff}
.pill.ok{background:var(--pri-soft);color:var(--pri)}
.status{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}
/* list picker */
.plist{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.pitem{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border:1px solid transparent;border-radius:12px;background:var(--card);text-align:left;box-shadow:var(--shadow)}
.pitem.on{border-color:var(--pri);background:var(--pri-soft)}
.pitem .t{font-weight:600}
.pitem .s{color:var(--mut);font-size:13px}
.pitem.new{border:1px dashed var(--pri);color:var(--pri);background:transparent;box-shadow:none;font-weight:600}
.pitem .tick-on{color:var(--pri);font-weight:700;font-size:18px;margin-left:auto}
.sticky-search{position:sticky;top:58px;background:var(--bg);z-index:2;padding-bottom:10px}
/* time wheels */
.wheels{position:relative;display:flex;justify-content:center;gap:4px;height:220px;margin:6px 0 4px;user-select:none;-webkit-user-select:none}
.wheels .band{position:absolute;left:0;right:0;top:90px;height:40px;border-radius:10px;background:var(--row);pointer-events:none}
.wheels .colon{position:relative;line-height:220px;font-size:22px;font-weight:700}
.wheel{position:relative;width:76px;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.signin{max-width:360px;margin:0 auto;padding:max(12vh,48px) 24px 40px;text-align:center}
.signin img{border-radius:16px;display:block;margin:0 auto 14px}
.signin h1{font-size:22px;margin:0 0 22px}
.signin form{text-align:left}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin:0 -8px 4px}
.cal-hd b{font-size:17px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-bottom:8px}
.cal-g .wd{font-size:12px;font-weight:600;color:var(--mut);padding:2px 0 6px}
.cal-g button{min-height:44px;border:0;background:none;border-radius:10px;font-size:16px;color:var(--ink)}
.cal-g button.in{background:var(--pri-soft)}
.cal-g button.td{box-shadow:inset 0 0 0 1.5px var(--pri);font-weight:700}
.cal-g button.on{background:var(--pri);color:var(--onp);font-weight:700}
.cal-g button:disabled{color:var(--field)}
.wheel .sp{height:90px}
.wheel .wi{height:40px;line-height:40px;text-align:center;font-size:20px;scroll-snap-align:center;color:var(--mut);cursor:pointer}
.wheel .wi.sel{color:var(--ink);font-weight:700;font-size:23px}
/* day timeline */
.tl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px;border-top:1px solid var(--line)}
.tl-in{position:relative}
.tl-r{display:flex;height:48px;border-bottom:1px solid var(--line)}
.tl-l{width:96px;flex:none;position:sticky;left:0;background:var(--bg);z-index:5;padding:5px 0 0 12px;font-size:12px;border-right:1px solid var(--line)}
.tl-l .mut{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-t{flex:1;position:relative}
.tick{position:absolute;top:12px;width:24px;height:24px;margin-left:-12px;border-radius:50%;border:2px solid var(--card);color:#fff;font-size:12px;font-weight:700;padding:0;z-index:4;line-height:20px}
.tick.late{box-shadow:0 0 0 2px var(--bad)}
.tick.off{opacity:.4}
/* drawn check mark: sits dead center at any size (a text ✓ rides low) */
.tick,.chk{display:flex;align-items:center;justify-content:center}
.ck{display:block;width:1em;height:1em;flex:none}
.ck svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grp{font-size:13px;font-weight:700;margin:14px 0 6px}
.task-hint{font-size:13px;color:var(--pri);font-weight:600}
.empty{padding:20px 4px;text-align:center;color:var(--mut)}
/* owner report: shown as a "paper" preview, and the only thing printed */
.paper{background:#fff;color:#1F2937;border-radius:10px;padding:22px 20px;box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:14px;line-height:1.45}
.paper h2{margin:0;font-size:20px;color:#0F766E}
.paper h3{margin:18px 0 6px;font-size:15px;border-bottom:1px solid #DDD;padding-bottom:4px}
.paper .sub{color:#5B6472}
.paper .day{margin:10px 0 2px;font-weight:700}
.paper .billt{width:100%;border-collapse:collapse}
.paper .billt td{padding:3px 0;vertical-align:top}
.paper .billt td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.paper .billt .tot td{border-top:1px solid #DDD;font-weight:700;padding-top:6px}
.paper .pl{margin-left:10px}
.paper .box{display:inline-block;width:12px;height:12px;border:1.5px solid #555;border-radius:2px;margin-right:6px;vertical-align:-1px}
.paper .msg{white-space:pre-wrap;border:1px solid #9CA3AF;border-radius:8px;padding:10px 12px;margin-top:6px}
#print{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff}
  #app{display:none !important}
  #print{display:block}

<script>
'use strict';

// ?demo opens a sample-data copy that never signs in and keeps its own storage
const DEMO = new URLSearchParams(location.search).has('demo');
const KEY = DEMO ? 'kennel-demo-v1' : 'kennel-proto-v8';
const BUSINESS = 'Little Village Pet Lodge';
const COLORS = ['#16A34A','#0EA5E9','#F59E0B','#A855F7','#EF4444','#EC4899','#14B8A6','#6366F1','#64748B'];
const STATUS = {booked:'Booked', in:'In kennel', out:'Checked out'};
const DAY_START = 6*60, DAY_END = 22*60;   // Day timeline runs 6 AM to 10 PM

/* ---------- dates and times: dates are 'YYYY-MM-DD', times 'HH:MM' (24h) ---------- */
const pad2 = n => String(n).padStart(2,'0');
const fmt = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const parseD = s => new Date(s+'T12:00');
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return fmt(d); };
const today = () => fmt(new Date());
const nowHM = () => { const n = new Date(); return pad2(n.getHours())+':'+pad2(n.getMinutes()); };
const weekStart = s => addDays(s, -parseD(s).getDay());          // Sunday
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/864e5);
const mins = t => { if(!t) return null; const [a,b] = t.split(':'); return +a*60 + +b; };
const dayFrac = t => { const m = mins(t); if(m==null) return 1; return Math.max(0, Math.min(1, (m-DAY_START)/(DAY_END-DAY_START))); };
const calFrac = t => { const m = mins(t); return m==null ? 1 : m/1440; };   // week grid columns are midnight to midnight
const md = s => parseD(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const wmd = s => parseD(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const longDay = s => parseD(s).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
const t12 = t => { if(!t) return ''; const [a,b] = t.split(':'); return ((+a+11)%12+1)+':'+b+(+a<12?' AM':' PM'); };
const stamp = (d,t) => d+'T'+(t||'00:00');
/* A stay can move kennels partway through: s.moves = [{date, time, kennel}]. s.kennel is
   where it starts. pieces(s) splits the stay into [{k, d, t, e, et}] runs in one kennel. */
const byWhen = (a, b) => stamp(a.date, a.time) < stamp(b.date, b.time) ? -1 : 1;
function pieces(s){
  const out = []; let k = s.kennel, d = s.start, t = s.arr;
  for(const m of [...(s.moves||[])].sort(byWhen)){
    const at = stamp(m.date, m.time);
    if(at <= stamp(d, t) || at >= stamp(s.end, s.pick) || m.kennel===k) continue;
    out.push({k, d, t, e:m.date, et:m.time}); k = m.kennel; d = m.date; t = m.time;
  }
  out.push({k, d, t, e:s.end, et:s.pick});
  return out;
}
// which kennel a stay is in at a given day and time (before it starts: the first kennel)
const kennelAt = (s, D, T = '12:00') => { let k = s.kennel; for(const p of pieces(s)) if(stamp(p.d, p.t) <= stamp(D, T)) k = p.k; return k; };
const piecesOverlap = (p, q) => stamp(p.d, p.t) < stamp(q.e, q.et) && stamp(q.d, q.t) < stamp(p.e, p.et);
const atTime = (D, hm) => new Date(D+'T'+hm).getTime();
const hmOf = ms => { const d = new Date(ms); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
const plural = (n, w) => n+' '+w+(n===1?'':'s');

let seq = 0;
const uid = p => (p||'i')+Date.now().toString(36)+(seq++).toString(36)+Math.random().toString(36).slice(2,5);

/* ---------- data ---------- */
function task(tag, times, note, pet){ return {id:uid('t'), tag, times:times||[], note:note||'', pet:pet||''}; }
// Clock times written in a customer's med instructions ("8am", "6:30 pm", "18:00", "noon"), as HH:MM.
// Only real times: "twice a day" or "with dinner" give none, and the med stays as needed.
function medTimes(text){
  const out = new Set(), t = String(text || '').toLowerCase();
  if(/\bnoon\b/.test(t)) out.add('12:00');
  for(const m of t.matchAll(/\b(\d{1,2})(?::([0-5]\d))?\s*(a\.?m\.?|p\.?m\.?)(?![a-z])/g)){
    let hh = +m[1]; if(hh < 1 || hh > 12) continue;
    if(m[3][0]==='p' && hh < 12) hh += 12; if(m[3][0]==='a' && hh===12) hh = 0;
    out.add(pad2(hh)+':'+(m[2] || '00')); }
  for(const m of t.matchAll(/(?<![\d:])([01]?\d|2[0-3]):([0-5]\d)(?!\s*(?:a\.?m|p\.?m))(?!\d)/g)) out.add(pad2(+m[1])+':'+m[2]);
  return [...out].sort();
}
function copyPlan(pl){ return pl.map(t => ({...t, id:uid('t'), times:[...t.times]})); }
// Care can be dated: `from` (first day) and `until` (last day). Ended care stays in the plan
// so past days, check-offs and owner reports keep showing what was actually scheduled.
const activeOn = (t, D) => (!t.from || D >= t.from) && (!t.until || D <= t.until);
const current = t => !t.until;   // what's shown and edited: care that hasn't been ended
// The version of a care item in effect on day D, or null when it isn't scheduled then.
// Edits keep the earlier version in t.hist as {until, tag, times, note, pet}, oldest first.
function versionOn(t, D){
  if(!activeOn(t, D)) return null;
  for(const v of t.hist || []) if(D <= v.until) return v;
  return t;
}
// Fields follow the Little Village Pet Lodge intake form.
const CLIENT_DEF = {first:'', name:'', email:'', cell:'', phone:'', work:'', city:'', state:'', zip:'',
  coName:'', coMain:'', coAlt:'', emName:'', emMain:'', emAlt:'', vet:'', vetPhone:'', pickupBy:'', signed:'', notes:''};
const PET_DEF = {name:'', species:'dog', other:'', breed:'', color:'', dob:'', sex:'', fixed:'',
  conditions:'', diet:'', food:'', perDay:'', dietNotes:'', treats:'', treatFav:'',
  personality:[], along:[], jumps:'', bites:'', fights:'', chews:'', likes:'', dislikes:'', notes:'', vaxOk:''};
const fillClient = c => { for(const k in CLIENT_DEF) if(c[k]==null) c[k] = CLIENT_DEF[k]; c.pets ||= []; c.pets.forEach(fillPet); return c; };
const fillPet = p => { for(const k in PET_DEF) if(p[k]==null) p[k] = Array.isArray(PET_DEF[k]) ? [] : (typeof PET_DEF[k]==='object' ? {} : PET_DEF[k]); p.plan ||= []; return p; };
const SP = [['dog','Dogs'],['cat','Cats'],['other','Small mammals']];
const spKey = sp => sp==='cat' ? 'tplCat' : sp==='other' ? 'tplOther' : 'tpl';
const tplFor = sp => S[spKey(sp)] || S.tpl;
// cats and small mammals start from the dog care without potty breaks
const noPotty = plan => copyPlan(plan).filter(t => !/potty/i.test((S.tags||[]).find(g => g.id===t.tag)?.name || t.tag));
const samePlan = (a, b) => JSON.stringify(a.map(({tag,times,note}) => [tag,times,note||''])) === JSON.stringify(b.map(({tag,times,note}) => [tag,times,note||'']));
function newPet(name, species){ return fillPet({id:uid('p'), name, species:species||'dog', plan:copyPlan(tplFor(species||'dog'))}); }
const PERSONALITY = ['Shy at first','Paw-fers privacy','Playful','Cuddlebug','Love at first lick'];
const ALONG = ['Cats','Dogs','Humans','Everyone'];
const FLAGS = [['bites','Has bitten'],['fights','Starts fights'],['jumps','Jumps fences'],['chews','Chews beds']];
const petFlags = p => FLAGS.filter(([k])=>p[k]==='yes').map(([,l])=>l).concat(p.conditions ? ['Medical'] : []);
const flagPills = p => petFlags(p).map(f => h('span',{class:'pill bad'}, f));
const bestPhone = c => c.cell || c.phone || c.work || '';
const allPhones = c => [c.cell, c.phone, c.work].map(x=>(x||'').replace(/\D/g,'')).filter(x=>x.length>6);
const ageOf = dob => { if(!dob) return ''; const m = (new Date().getFullYear()-+dob.slice(0,4))*12 + (new Date().getMonth()+1-+dob.slice(5,7)); return m<12 ? plural(Math.max(0,m),'month')+' old' : plural(Math.floor(m/12),'year')+' old'; };

function migrate(d){
  if(d && d.v===2){
    d.clients.forEach(c => c.pets.forEach(p => { p.species = p.species || 'dog'; delete p.vacc; }));
    d.v = 3;
  }
  if(d && d.v===3){
    delete d.me;
    d.clients.forEach(c => { if(typeof c.emerg==='string'){ c.emName = c.emerg; delete c.emerg; } });
    d.stays.forEach(s => { s.belongings ??= ''; });
    d.v = 4;
  }
  if(d && d.v===4){ if(d.hideEmpty){ d.kf='week'; delete d.hideEmpty; } d.clients.forEach(fillClient); d.stays.forEach(s => { s.report ??= ''; delete s.pickupBy; });
    // vaccines are now one yes/no per pet (the intake waiver just says they're up to date)
    delete d.vaccines; d.clients.forEach(c => c.pets.forEach(p => { delete p.vax; }));
    // personality is one pick, and "Everyone" stands alone
    d.clients.forEach(c => c.pets.forEach(p => { p.personality = p.personality.slice(0,1); if(p.along.includes('Everyone')) p.along = ['Everyone']; }));
    d.book ??= defaultBook(d.kennels);
    d.rates ??= defaultRates();
    if(!d.tplCat){ const plain = copyPlan(d.tpl).filter(t => !/potty/i.test((d.tags||[]).find(g => g.id===t.tag)?.name || t.tag)); d.tplCat = plain; d.tplOther = copyPlan(plain); }
    if(d.book.eveFee==null){ d.book.eveFee = 5; d.book.eveFrom ||= '16:00'; }
    // requests now wait for an answer unless auto-decline is turned on (replaces the old fixed hold)
    if('hold' in d.book){ delete d.book.hold; d.book.auto ??= 0; d.book.autoMsg ??= ''; }
    return d; }
  return null;
}

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Georgia, serif" fill="#222">
<rect width="600" height="420" fill="#fffdf7"/><rect x="14" y="14" width="572" height="392" fill="none" stroke="#0F766E" stroke-width="3"/>
<text x="300" y="62" text-anchor="middle" font-size="26" font-weight="bold">Certificate of Vaccination</text>

${rows.map((r,i) => `<text font-size="15" y="${218+i*32}"><tspan x="44">${r[0]}</tspan><tspan x="270">${r[1]}</tspan><tspan x="420">${r[2]}</tspan></text>`).join('')}
<text x="44" y="380" font-size="14" fill="#555">Signed: Dr. Sample, DVM (demo record)</text></svg>`;
  return {id:uid('d'), name:'Vaccine certificate', kind:'img', at:addDays(today(), -60), data:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)};
}

  const max = pet('Max', {breed:'Husky', color:'Black & white', sex:'m', fixed:'yes', jumps:'yes', personality:['Playful'], along:['Dogs']});
  const biscuit = pet('Biscuit', {breed:'Dachshund', color:'Red', sex:'m', fixed:'yes', treats:'yes', treatFav:'chicken jerky', personality:['Love at first lick']});

  const cl = (name, first, cell, pets, more={}) => fillClient({id:uid('c'), name, first, cell, pets, vet, vetPhone, signed:addDays(today(),-60), ...more});
  const clients = [
    cl('Whitfield','Sarah','555-0101',[tucker,hazel],{emName:'Tom Whitfield', emMain:'555-0102', pickupBy:'Grandma Jean'}),

    cl('Garcia','Maria','555-0119',[daisy]),
    cl('Hughes','Ben','555-0165',[luna,max]),

    cl('Nguyen','An','555-0148',[pepper],{signed:''}),
    cl('Ortiz','Luis','555-0172',[duke]),
    cl('Patel','Ravi','555-0109',[coco]),

  const t0 = today(), d = n => addDays(t0,n);

function h(tagName, attrs, ...kids){
  const e = document.createElement(tagName);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(v===false || v==null) continue;
    if(k.startsWith('on')) e[k] = v;
    else if(k==='style') e.style.cssText = v;
    else if(k==='value' || k==='checked') e[k] = v;
    else if(k==='html') e.innerHTML = v;
    else e.setAttribute(k, v===true ? '' : v);
  }
  for(const c of kids.flat(Infinity)){
    if(c===false || c==null || c==='') continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

/* ---------- step-by-step flows ----------
   Approving a request: Request > Book (a step per kennel) > Text them. Declining: Request > Decline.
   Filing a guest form: Guest form > Family. A strip at the top of each step shows where she is, and
   earlier steps can be tapped. Back (or ×) goes one step back and takes back what that step did:
   a stay it booked comes off, and from the first stay, a family or pets made for the request go away.
   U.flow = {kind:'req'|'form', id, fam, stack:[{data, sheet, prev}]}: before each step, the families
   and stays as they were and the sheet to return to. Closing a flow any other way ends it. */
const snapData = () => JSON.stringify({clients:S.clients, stays:S.stays});
const inFlow = (kind, id) => !!(U.flow && U.flow.kind===kind && U.flow.id===id && U.flow.stack.length);
function flowBack(to){
  const F = U.flow; if(!F || !F.stack.length) return close();
  if(to == null) to = F.stack.length - 1;
  const e = F.stack[to]; F.stack.length = to;
  if(F.kind==='req'){ const r = R.list.find(x => x.id===F.id);
    if(r && r.status==='approved') answerReq(r, {status:'pending', stay_id:null, texted:null, answered_at:null}, true); }
  if(F.kind==='form'){ const g = G.list.find(x => x.id===F.id); if(g) saveForm(g, e.prev); }
  const d = JSON.parse(e.data); S.clients = d.clients; S.stays = d.stays; save();
  if(!F.stack.length) U.flow = null;   // back at the start, as if nothing happened
  open(e.sheet);
}
function steps(list, at, go){
  return h('ol',{class:'steps', 'aria-label':'Steps'}, list.map((l, i) => h('li',{class:i===at ? 'on' : '', 'aria-current':i===at ? 'step' : null},
    i < at && go ? h('button',{onclick:()=>go(i)}, h('span',{class:'n'}, i+1), l) : [h('span',{class:'n'}, i < at ? '✓' : i+1), l])));
}
const bookSteps = n => ['Request', ...(n > 1 ? Array.from({length:n}, (_, i) => 'Kennel '+(i+1)) : ['Book']), 'Text them'];
function flowStrip(u){
  if(!u) return null;
  if(u.t==='req'){ const r = R.list.find(x => x.id===u.id); return r && r.status==='pending' ? steps(['Request', 'Book', 'Text them'], 0) : null; }
  if(u.t==='form' && u.f && u.f.req){ const f = u.f, n = f.made.length + 1 + f.queue.length;
    return steps(bookSteps(n), f.made.length + 1, inFlow('req', f.req) ? i => flowBack(i) : null); }
  if(u.t==='reqans'){ const r = R.list.find(x => x.id===u.id); if(!r) return null;
    if(u.act!=='approved') return steps(['Request', 'Decline'], 1, () => open({t:'req', id:r.id}));
    const n = (r.stay_id || '').split(',').filter(Boolean).length || 1;
    return steps(bookSteps(n), n + 1, inFlow('req', r.id) ? i => flowBack(i) : null); }
  if(u.t==='gform'){ const g = G.list.find(x => x.id===u.id); return g && g.status==='new' ? steps(['Guest form', 'Family'], 0) : null; }
  if(u.t==='client' && U.flow && U.flow.kind==='form' && U.flow.fam===u.id && U.flow.stack.length){ const c = client(u.id);
    return steps(['Guest form', 'Family'], 1, () => confirmSheet('Go back to the form?', 'Takes back filing it: what it filled in on the '+(c ? c.name+' family' : 'family')+' comes off, along with any changes you made since.', 'Go back', () => flowBack(0), u)); }
  return null;
}

// One scrollable wheel. values: [[value,label]]. Calls onChange as it settles.
function wheel(values, cur, onChange, label){
  const IH = 40;
  let idx = Math.max(0, values.findIndex(v=>v[0]===cur));
  const items = values.map(([v,l],i) => h('div',{class:'wi'+(i===idx?' sel':''), onclick:()=>el.scrollTo({top:i*IH, behavior:'smooth'})}, l));
  const el = h('div',{class:'wheel', role:'listbox', 'aria-label':label, tabindex:'0'}, h('div',{class:'sp'}), items, h('div',{class:'sp'}));
  el.onscroll = () => {
    const i = Math.max(0, Math.min(values.length-1, Math.round(el.scrollTop/IH)));
    if(i!==idx){ items[idx].classList.remove('sel'); items[i].classList.add('sel'); idx = i; onChange(values[i][0]); }
  };
  el.onkeydown = e => { if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); el.scrollTo({top:(idx+(e.key==='ArrowDown'?1:-1))*IH, behavior:'smooth'}); } };
  AFTER.push(() => { el.scrollTop = idx*IH; });
  return el;
}

/* ---------- color picker: wheel (hue around, strength outward), brightness slider, R G B boxes ---------- */
const hexToRgb = x => { const n = parseInt(x.slice(1),16); return [n>>16&255, n>>8&255, n&255]; };
const rgbToHex = (r,g,b) => '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
function rgbToHsv(r,g,b){ r/=255; g/=255; b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h = d===0 ? 0 : mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; h = (h*60+360)%360;
  return [h, mx===0 ? 0 : d/mx, mx]; }
function hsvToRgb(h,s,v){ const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  const [r,g,b] = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return [(r+m)*255,(g+m)*255,(b+m)*255]; }
function pickColor(value, onSet){ openPick({kind:'color', value:value||'#16A34A', onSet}); }
function colorPickerView(pk){
  const st = pk.st || (pk.st = (()=>{ const [h,s,v] = rgbToHsv(...hexToRgb(pk.value)); return {h,s,v:Math.max(v,.25)}; })());
  const SIZE = 220, R0 = SIZE/2;
  const cv = h('canvas',{class:'cwheel', width:SIZE*2, height:SIZE*2, 'aria-label':'Color wheel'});
  const mark = h('div',{class:'cmark'});
  const prev = h('div',{class:'cprev'});
  const ins = ['R','G','B'].map(l => h('input',{type:'number', min:0, max:255, inputmode:'numeric', 'aria-label':l}));
  const range = h('input',{type:'range', class:'crange', min:20, max:100, 'aria-label':'Brightness'});
  const drawWheel = () => {
    const ctx = cv.getContext('2d'), N = SIZE*2, img = ctx.createImageData(N,N), r = N/2;
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const dx=x-r, dy=y-r, d=Math.sqrt(dx*dx+dy*dy); if(d>r) continue;
      const [R,G,B] = hsvToRgb((Math.atan2(dy,dx)*180/Math.PI+360)%360, d/r, st.v);
      const i=(y*N+x)*4; img.data[i]=R; img.data[i+1]=G; img.data[i+2]=B; img.data[i+3]=255; }
    ctx.putImageData(img,0,0);
  };
  const sync = (fromInputs) => {
    const rgb = hsvToRgb(st.h, st.s, st.v), hex = rgbToHex(...rgb);
    const a = st.h*Math.PI/180;
    mark.style.left = (R0 + Math.cos(a)*st.s*R0)+'px'; mark.style.top = (R0 + Math.sin(a)*st.s*R0 + 4)+'px';
    mark.style.background = hex; prev.style.background = hex;
    if(!fromInputs) ins.forEach((el,i)=>el.value = Math.round(rgb[i]));
    range.value = Math.round(st.v*100);
  };
  const fromPoint = e => { const b = cv.getBoundingClientRect(), dx = e.clientX-b.left-b.width/2, dy = e.clientY-b.top-b.height/2;
    st.h = (Math.atan2(dy,dx)*180/Math.PI+360)%360; st.s = Math.min(1, Math.sqrt(dx*dx+dy*dy)/(b.width/2)); sync(); };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); fromPoint(e); };
  cv.onpointermove = e => { if(e.buttons || e.pointerType==='touch') if(cv.hasPointerCapture(e.pointerId)) fromPoint(e); };
  range.oninput = () => { st.v = range.value/100; drawWheel(); sync(); };
  ins.forEach(el => el.oninput = () => { const v = ins.map(x => Math.max(0,Math.min(255, +x.value||0)));
    [st.h, st.s, st.v] = rgbToHsv(...v); st.v = Math.max(st.v,.01); drawWheel(); sync(true); });
  AFTER.push(() => { drawWheel(); sync(); });
  const finish = () => { const fn = pk.onSet; U.pk = null; fn(rgbToHex(...hsvToRgb(st.h,st.s,st.v))); render(); };
  return h('div',{class:'ov pk', onclick:e=>{ if(e.target===e.currentTarget) closePick(); }},
    h('div',{class:'sh', role:'dialog', 'aria-label':'Custom color'},
      h('div',{class:'hd'}, h('h1',{}, 'Custom color'), btn('×', closePick, 'ic', {'aria-label':'Close'})),
      h('div',{class:'cwrap'}, cv, mark),
      field('Brightness', range),
      h('div',{class:'crow', style:'margin-bottom:6px'}, prev, ['Red','Green','Blue'].map((l,i)=>field(l, ins[i]))),
      h('div',{class:'ft'}, btn('Cancel', closePick, 'b2'), btn('Use this color', finish))));
}

/* ---------- care tasks for a stay on a given day ---------- */
function tasksFor(s, D){
  if(D < s.start || D > s.end) return [];
  const out = [];
  for(const pid of s.pets){
    const x = findPet(pid); if(!x) continue;
    const forPet = v => !v.pet || v.pet===pid;
    for(const t of x.p.plan.concat(s.extra)){
      const v = versionOn(t, D), key = tm => [s.id,pid,t.id,D,tm].join('|');
      const times = new Set(v && forPet(v) ? v.times : []);
      // a check-off never disappears: times checked off under an earlier or ended version still show
      for(const old of [...(t.hist || []), t]) if(forPet(old)) for(const tm of old.times) if(S.log[key(tm)]) times.add(tm);
      const view = v && v!==t ? {...t, tag:v.tag, note:v.note, pet:v.pet} : t;
      for(const tm of times){
        if(D===s.start && tm < s.arr) continue;   // before drop-off
        if(D===s.end && tm > s.pick) continue;    // after pickup
        out.push({s, p:x.p, c:x.c, t:view, tm, key:key(tm), D});
      }
    }
  }
  return out.sort((a,b)=> a.tm<b.tm ? -1 : a.tm>b.tm ? 1 : 0);
}

function matchClient(c, q){
  if(!q) return true;
  const qd = q.replace(/\D/g,'');
  return c.name.toLowerCase().includes(q) || c.pets.some(p=>p.name.toLowerCase().includes(q)) || (qd.length>2 && allPhones(c).some(x=>x.includes(qd))) || (c.first||'').toLowerCase().includes(q);
}
const byName = (a,b) => a.name.localeCompare(b.name);
/* Archiving keeps history: an archived family (c.archived) or an archived pet (p.gone)
   is hidden from lists and pickers, but their past stays, details and forms stay as they were.
   They come back on their own when they book again, or with "Bring back". Deleting for good is
   still there, behind the archive. */
const livePets = c => c.pets.filter(p => !p.gone);
const liveClients = () => S.clients.filter(c => !c.archived);
// upcoming stays not yet checked in, for one family (or just the stays with one pet)
const upcomingStays = (cid, pid) => { const c = client(cid), mine = new Set(pid ? [pid] : c.pets.map(p => p.id));
  return S.stays.filter(s => s.status==='booked' && s.start >= today() && s.pets.some(i => mine.has(i))); };
const clientLine = c => [livePets(c).map(p=>p.name).join(', ') || 'No pets yet', bestPhone(c)].filter(Boolean).join(' · ');

  };
  draw();
  return [h('div',{class:'top hdr'}, h('h1',{},'Clients'), btn('+ New family', ()=>open({t:'client', name:U.q.trim()}), 'chip add')),
    h('div',{class:'pad', style:'margin-bottom:10px'},

function importData(e){

  file.text().then(txt => {

    if(Array.isArray(d)) d = fromRows(d);   // a nightly backup file: one row per record
    d = migrate(d);
    if(!d || !Array.isArray(d.stays)) { alert('That file isn’t a kennel backup.'); return; }
    confirmSheet('Replace all data?', 'Everything here is replaced with the backup from that file.', 'Replace', ()=>{ S=d; });
  });
}

/* ---------- moving a stay to another kennel ---------- */
function moveSheet(u){
  const s = S.stays.find(x => x.id===u.id); if(!s) return null;
  const td = today(), now = nowHM();
  const f = u.f ||= (() => { const inStay = s.start <= td && td <= s.end;
    return {date: inStay ? td : s.start, time: inStay ? now.slice(0,3)+(now.slice(3) < '30' ? '00' : '30') : s.arr}; })();
  const whole = stamp(f.date, f.time) <= stamp(s.start, s.arr);
  const from = whole ? {date:s.start, time:s.arr} : f;
  const cur = kennelAt(s, from.date, from.time);
  // the rest of the stay from that moment, in a candidate kennel
  const rest = k => ({id:s.id, kennel:k, start:from.date, arr:from.time, end:s.end, pick:s.pick});
  const go = k => {
    if(whole){ s.kennel = k; s.moves = []; }
    else s.moves = (s.moves||[]).filter(m => stamp(m.date, m.time) < stamp(f.date, f.time)).concat({date:f.date, time:f.time, kennel:k});
    if(!s.moves.length) delete s.moves;
    open({t:'stay', id:s.id}); commit();
  };
  const back = () => open({t:'stay', id:s.id});
  const ps = pieces(s), moves = [...(s.moves||[])].sort(byWhen);
  const isNow = !whole && f.date===td && Math.abs(mins(f.time) - mins(now)) < 31;
  const unmove = m => { s.moves = (s.moves||[]).filter(x => x!==m); if(!s.moves.length) delete s.moves; save(); render(); };
  return sheet('Move '+petNames(s), [
    // where they've been so far, oldest first; a move can be taken back
    ps.length > 1 && [h('div',{class:'lbl mut', style:'font-weight:600;font-size:12px;margin:0 0 6px'}, 'Kennels this stay'),
      h('div',{class:'card', style:'padding:4px 14px'}, ps.map((p, i) => { const m = i > 0 ? moves.find(x => x.date===p.d && x.time===p.t) : null;

function fmtPhone(v){
  let d = v.replace(/\D/g,'');
  if(/[a-z#]/i.test(v)) return v;   // letters or # mean an extension or a note: leave it alone
  if(d.length===11 && d[0]==='1') d = d.slice(1);   // US country code, with or without +
  if(d.length===10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  if(d.length===7 && !v.trim().startsWith('+')) return d.slice(0,3)+'-'+d.slice(3);

}

function delTagSheet(u){
  const t = S.tags.find(x=>x.id===u.id); if(!t) return null;
  const dated = [...S.clients.flatMap(c=>c.pets.map(p=>p.plan)), ...S.stays.map(s=>s.extra)];
  const n = [S.tpl, S.tplCat||[], S.tplOther||[], ...dated].reduce((a,pl)=>a + pl.filter(x=>x.tag===t.id && current(x)).length, 0);
  const back = () => open({t:'tag', id:t.id});
  return sheet('Delete “'+t.name+'”?', [
    h('p',{}, (n ? 'It comes off the '+plural(n,'schedule')+' that use it from today. ' : '')+'Earlier days and check-offs still show it.'),
    n>0 && h('p',{class:'mut'},'To keep it on those schedules but stop using it for new care, archive it instead.')
  ], [btn('Cancel', back, 'b2'), n>0 && btn('Archive', ()=>{ t.arch=true; U.sh=null; commit(); }, 'b2'), btn('Delete', ()=>{
        const td = today();
        ['tpl','tplCat','tplOther'].forEach(k => { if(S[k]) S[k] = S[k].filter(x=>x.tag!==t.id); });
        // on pets and stays it ends yesterday, so earlier days keep it; care that only started today just goes
        dated.forEach(pl=>{ for(let i=pl.length-1;i>=0;i--){ const x = pl[i]; if(x.tag!==t.id || !current(x)) continue;
          if(x.from && x.from >= td) pl.splice(i,1); else x.until = addDays(td,-1); } });
        t.del = true;   // kept (hidden) so old records still know what it was
        U.sh=null; commit();
      }, 'b bd')], back);
}

// What the owner gets at pickup: dates, what was done for each pet each day, a note, and what goes home.
function reportPaper(s){
  const c = stayClient(s), pets = s.pets.map(i=>findPet(i)?.p).filter(Boolean);
  const days = []; for(let D=s.start; D<=s.end; D=addDays(D,1)) days.push(D);
  const dayBlocks = days.map(D => {
    const done = tasksFor(s,D).filter(it=>S.log[it.key]);
    if(!done.length) return null;
    return [h('div',{class:'day'}, wmd(D)),
      pets.map(p => {
        const mine = done.filter(it=>it.p.id===p.id); if(!mine.length) return null;
        const byTag = {};
        mine.forEach(it => { const e = S.log[it.key]; (byTag[e.tag] ||= []).push(e.at); });
        return h('div',{class:'pl'}, pets.length>1 && h('b',{}, p.name+': '),
          Object.entries(byTag).map(([name, ts]) => name+' '+ts.sort((a,b)=>a-b).map(t=>t12(hmOf(t))).join(', ')).join(' · '));
      })];
  }).filter(Boolean);
  const items = (s.belongings||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
  return h('div',{class:'paper'},
    h('h2',{}, BUSINESS),
    h('div',{class:'sub'}, 'Stay report'),
    h('h3',{}, petNames(s)+(c ? ' · '+((c.first?c.first+' ':'')+c.name) : '')),
    h('div',{}, h('b',{},'Dropped off: '), wmd(s.start)+', '+t12(s.arr)),
    h('div',{}, h('b',{},'Picked up: '), wmd(s.end)+', '+t12(s.pick)),
    s.report && [h('h3',{},'A note from us'), h('div',{class:'msg'}, s.report)],
    h('h3',{},'Care during the stay'),
    dayBlocks.length ? dayBlocks : h('div',{class:'sub'},'No care was logged for this stay.'),
    items.length>0 && [h('h3',{},'Going home'), items.map(x => h('div',{}, h('span',{class:'box'}), x))],

/* ---------- website editor (Settings > Website) ----------
   The lodge website draws its text, prices and photos from S.site (record site:main),
   read publicly through site_content(). S.site stays empty until someone edits, so a

   Hours come from the booking rules, not from here. */

async function addSitePhotos(W, files){
  if(!files.length) return;
  U.upl = {pet:'site'}; render();
  let err = '';
  for(const f of files){
    if(!/^image\//.test(f.type)){ err = 'Only photos can be added.'; continue; }
    try {
      const big = await shrinkImage(f, 1600), small = await shrinkImage(f, 640);
      const id = uid('w'), p = {id, cap:''};   // caption added by tapping the photo
      if(DEMO){ p.src = await asDataURL(small); p.sm = p.src; }
      else {
        for(const [name, blob] of [[id+'.jpg', big], [id+'-sm.jpg', small]])
          await storage('object/site/'+name, {method:'POST', headers:{'Content-Type':'image/jpeg', 'x-upsert':'false'}, body:blob});
        p.src = SUPA.url+'/storage/v1/object/public/site/'+id+'.jpg'; p.sm = SUPA.url+'/storage/v1/object/public/site/'+id+'-sm.jpg';
      }
      const live = S.site || W; live.photos.push(p); S.site = live; save();
    } catch(e){ err = 'Couldn’t upload. Check the signal and try again.'; }
  }
  U.upl = err ? {pet:'site', err} : null;
  quietRender();
}

/* ---------- money: rates in Settings, a bill on each stay ----------
   The bill adds itself up from the rates (per pet per night, the sharing discount, the
   evening and outside-hours fees from Online booking); any automatic line can be waived.
   Extra charges and discounts are added by hand (s.charges: {id, label, amt, qty}, amt < 0
   for a discount). Paying by card adds the card fee. */
const defaultRates = () => ({dog:25, cat:15, other:10, share:2, meds:2, card:2.6});
const money = n => { const a = Math.abs(Math.round(n*100)/100); return (n < 0 ? '−' : '')+'$'+(a % 1 ? a.toFixed(2) : a); };
function billFor(s){
  const R0 = S.rates || defaultRates(), B = S.book, waived = new Set(s.waive||[]), lines = [];
  const nights = Math.max(1, daysBetween(s.start, s.end));
  const pets = s.pets.map(id => findPet(id)?.p).filter(Boolean);
  pets.forEach(p => { const sp = p.species==='cat' ? 'cat' : p.species==='other' ? 'other' : 'dog';
    lines.push({key:'pet:'+p.id, label:p.name, sub:plural(nights,'night')+' × '+money(R0[sp]), amt:nights*R0[sp]}); });
  if(pets.length > 1 && R0.share) lines.push({key:'share', label:'Sharing a kennel', sub:pets.length+' pets × '+plural(nights,'night')+' × '+money(-R0.share), amt:-pets.length*nights*R0.share});
  if(B.fee && offHours(s.start, s.arr)) lines.push({key:'arrOff', label:'Drop-off outside hours', sub:t12(s.arr), amt:B.fee});
  if(B.fee && offHours(s.end, s.pick)) lines.push({key:'pickOff', label:'Pickup outside hours', sub:t12(s.pick), amt:B.fee});
  // a late pickup: the kennel's used all day, like a late checkout (not on Sundays, when the hours are only evenings)
  else if(B.eveFee && s.pick >= (B.eveFrom || '16:00') && parseD(s.end).getDay()!==0) lines.push({key:'eve', label:'Late pickup', sub:t12(s.pick), amt:B.eveFee});
  lines.forEach(l => { l.auto = true; l.waived = waived.has(l.key); });
  (s.charges||[]).forEach(c => lines.push({id:c.id, label:c.label || (c.amt < 0 ? 'Discount' : 'Extra charge'), sub:c.qty > 1 ? c.qty+' × '+money(c.amt) : '', amt:c.amt*(c.qty||1)}));
  const sub = lines.reduce((t, l) => t + (l.waived ? 0 : l.amt), 0);
  if(s.card && R0.card) lines.push({key:'card', label:'Card fee', sub:R0.card+'%', amt:Math.round(sub*R0.card)/100});
  return {lines, total:lines.reduce((t, l) => t + (l.waived ? 0 : l.amt), 0)};
}
// the bill as shown on a stay (and at checkout, without the buttons)
function billCard(s, editable){
  const b = billFor(s), R0 = S.rates || defaultRates();
  const toggle = key => { const w = new Set(s.waive||[]); w.has(key) ? w.delete(key) : w.add(key); s.waive = [...w]; if(!s.waive.length) delete s.waive; commit(); };
  return [h('div',{class:'card bill'},
      b.lines.map(l => h(editable && (l.id || (l.auto && l.key!=='card' && !l.key.startsWith('pet:'))) ? 'button' : 'div', {class:'bl-row'+(l.waived ? ' waived' : ''),
          onclick: !editable ? null : l.id ? ()=>open({t:'charge', stay:s.id, id:l.id}) : l.auto && l.key!=='card' && !l.key.startsWith('pet:') ? ()=>toggle(l.key) : null,
          'aria-label': editable && l.auto && l.key!=='card' && !l.key.startsWith('pet:') ? (l.waived ? 'Charge ' : 'Waive ')+l.label : null},
        h('span',{class:'grow'}, l.label, l.sub && h('small',{}, l.sub), l.waived && h('small',{}, editable ? 'waived, tap to charge' : 'waived')),
        h('b',{}, money(l.amt)))),
      h('div',{class:'bl-row bl-total'}, h('span',{class:'grow'}, 'Total'), h('b',{}, money(b.total)))),
    editable && h('div',{class:'row start wrap', style:'margin-top:8px'},
      btn('+ Charge', ()=>open({t:'charge', stay:s.id, kind:'charge'}), 'chip add'),
      btn('+ Discount', ()=>open({t:'charge', stay:s.id, kind:'discount'}), 'chip add'),
      R0.meds ? btn('+ Meds '+money(R0.meds), ()=>{ const m = (s.charges ||= []).find(c => c.label==='Medications given' && c.amt===R0.meds); if(m) m.qty = (m.qty||1) + 1; else s.charges.push({id:uid('c'), label:'Medications given', amt:R0.meds, qty:1}); commit(); }, 'chip add') : null,
      R0.card ? chip((s.card ? '✓ ' : '')+'Paid by card (+'+R0.card+'%)', !!s.card, ()=>{ s.card = !s.card; if(!s.card) delete s.card; commit(); }) : null,
      chip((s.ownFood ? '✓ ' : '')+'Brought own food', !!s.ownFood, ()=>{ s.ownFood = !s.ownFood; if(!s.ownFood) delete s.ownFood; commit(); })),
    editable && h('p',{class:'mut', style:'margin:6px 0 0;font-size:13px'}, 'Tap a fee to waive it. Tap a charge or discount to change it. The late pickup fee is left off on Sundays.')];
}

// add or change one extra charge or discount on a stay
function chargeSheet(u){
  const s = S.stays.find(x => x.id===u.stay); if(!s) return null;
  const orig = u.id && (s.charges||[]).find(c => c.id===u.id);
  const f = u.f ||= orig ? {label:orig.label, amt:String(Math.abs(orig.amt)), qty:orig.qty||1, kind:orig.amt < 0 ? 'discount' : 'charge'}
                         : {label:'', amt:'', qty:1, kind:u.kind || 'charge'};
  const back = () => open({t:'stay', id:s.id});
  const saveIt = () => {
    const n = Math.round(parseFloat(String(f.amt).replace(/[$,\s]/g,''))*100)/100;
    if(!(n > 0)){ u.err = 'Enter an amount.'; render(); return; }
    const c = {id:orig ? orig.id : uid('c'), label:f.label.trim(), amt:f.kind==='discount' ? -n : n, qty:f.qty};
    s.charges = (s.charges||[]).filter(x => x!==orig).concat(c);
    back(); commit();
  };
  const disc = f.kind==='discount';
  return sheet(orig ? (disc ? 'Discount' : 'Extra charge') : disc ? 'Add a discount' : 'Add a charge', [
    field('Type', seg([['charge','Charge'],['discount','Discount']], f.kind, v=>{ f.kind = v; render(); })),
    field('What for', h('input',{value:f.label, autocomplete:'off', placeholder:disc ? 'e.g. Returning customer' : 'e.g. Bath, extra walk', oninput:e=>{ f.label = e.target.value; }})),
    h('div',{class:'row', style:'align-items:flex-start'},
      field('Amount', h('div',{class:'row start', style:'gap:6px'}, h('b',{}, disc ? '−$' : '$'),
        h('input',{value:f.amt, inputmode:'decimal', autocomplete:'off', placeholder:'0', style:'width:110px', oninput:e=>{ f.amt = e.target.value; u.err = ''; }}))),
      field('How many', stepper(f.qty, 1, 60, 1, v=>{ f.qty = v; render(); }, v=>String(v)))),
    orig && h('div',{style:'margin:16px 0 8px'}, btn('Remove', ()=>{ s.charges = s.charges.filter(x => x!==orig); if(!s.charges.length) delete s.charges; back(); commit(); }, 'lk bad'))
  ], [u.err && h('div',{class:'err'}, u.err), btn('Cancel', back, 'b2'), btn(orig ? 'Save' : 'Add', saveIt)], back);
}

  const num = (o, k, a={}) => h('div',{class:'row start', style:'gap:6px'}, h('b',{}, a.pre ?? '$'),
    inp(o[k] ?? 0, v=>{ const n = Math.max(0, Math.round(parseFloat(String(v).replace(/[$,%\s]/g,''))*100)/100 || 0); o[k] = n; commit(); }, {inputmode:'decimal', style:'width:90px', 'aria-label':a.label}),

/* ---------- notifications for new requests (per phone) ----------
   The phone subscribes with the browser's push service; the subscription is saved in
   push_subs, and the request-spot server function notifies every saved phone. On iPhone
   this works only in the app opened from the home screen icon. */
const VAPID_PUB = 'BArT00BpVojpgIlfimBgeOb_LqGiLpie5j8F_NeQkz5EWhFu6FNfpNqBSvArQL_DGdDw47XIwOSU_sU18q4F-cQ';
const pushOK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64ToBytes = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
let PUSH = {state:'?', err:''};   // on, off, blocked, unsupported
async function pushState(){
  if(!pushOK()) return PUSH = {state:'unsupported', err:''};
  if(Notification.permission==='denied') return PUSH = {state:'blocked', err:''};
  const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
  return PUSH = {state:sub ? 'on' : 'off', err:''};
}
async function pushOn(){
  try {
    if(await Notification.requestPermission()!=='granted'){ PUSH = {state:'blocked', err:''}; render(); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUB)});
    const j = sub.toJSON();
    await api('/rest/v1/push_subs', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, user_id:Y.session.user})});
    PUSH = {state:'on', err:''};
  } catch(e){ PUSH = {state:PUSH.state, err:'Couldn’t turn them on. Check the signal and try again.'}; }
  render();
}
async function pushOff(){
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if(sub){ await api('/rest/v1/push_subs?endpoint=eq.'+encodeURIComponent(sub.endpoint), {method:'DELETE'}).catch(() => {}); await sub.unsubscribe(); }
    PUSH = {state:'off', err:''};
  } catch(e){ PUSH = {state:PUSH.state, err:'Couldn’t turn them off. Try again.'}; }
  render();
}
function notifySection(){
  if(DEMO || !synced()) return null;
  if(PUSH.state==='?') pushState().then(render, () => {});
  const st = PUSH.state;
  return [h('div',{class:'sec'},'Notifications'),
    h('p',{class:'mut', style:'margin-top:0'}, 'Get a notification on this phone when someone sends a booking request.'),
    st==='unsupported' ? h('div',{class:'warn'}, 'This browser can’t get notifications. On an iPhone, add the app to the home screen (Share, Add to Home Screen) and open it from the icon.')
    : st==='blocked' ? h('div',{class:'warn'}, 'Notifications are blocked for this app. Allow them in the phone’s settings, then come back here.')
    : field('On this phone', seg([['on','On'],['off','Off']], st==='on' ? 'on' : 'off', v=>{ v==='on' ? pushOn() : pushOff(); })),
    PUSH.err && h('p',{class:'err'}, PUSH.err)];
}

/* ============================== REQUESTS ============================== */
// Booking requests from the public page. They live in their own table (not the shared
// book): loaded with each sync, answered here. Approving books a stay (or one per kennel
// needed); the request is then marked approved. Answers made offline wait in Y.reqq.
const BIZ = 'Little Village Pet Lodge';
let R = {list:[], loaded:false, err:''};
// a request waits for an answer, unless auto-decline is on and its time is up
const reqTimedOut = r => r.status==='pending' && S.book.auto > 0 && Date.parse(r.created_at) + S.book.auto*3600e3 <= Date.now();
const reqHeld = r => r.status==='pending' && !reqTimedOut(r);
// a booked request the customer cancelled leaves its stays on the calendar until she removes them
const reqStays = r => (r.stay_id||'').split(',').filter(id => S.stays.some(s => s.id===id));
const reqWaiting = () => R.list.filter(r => reqHeld(r) || (r.status==='cancelled' && reqStays(r).length));
const firstName = n => (n||'').trim().split(/\s+/)[0] || '';
const lastName = n => { const w = (n||'').trim().split(/\s+/); return w.length > 1 ? w[w.length-1] : w[0] || ''; };
const reqPetsText = r => { const n = sp => r.pets.filter(p => p.species===sp).length;
  return [n('dog') && plural(n('dog'),'dog'), n('cat') && plural(n('cat'),'cat'), n('other') && plural(n('other'),'other pet')].filter(Boolean).join(', '); };
// "Rex and Fido share a kennel. Max has his own." from the kennel letters (or the old yes/no)
function reqShareText(r){
  if(!r.pets.some(p => p.group)) return r.share ? 'Can share a kennel' : 'Want separate kennels';
  const by = {}; r.pets.forEach(p => { if(p.species!=='other') (by[p.species+'|'+p.group] ||= []).push(p.name.trim()); });
  const groups = Object.values(by);
  if(!groups.length) return '';
  if(groups.length===1 && groups[0].length===1) return '';
  if(groups.every(a => a.length===1)) return 'Each has their own kennel.';
  return groups.map(a => a.length > 1 ? petList(a)+' share a kennel.' : a[0]+' has their own kennel.').join(' ');
}
const petList = names => names.length < 3 ? names.join(' and ') : names.slice(0,-1).join(', ')+' and '+names[names.length-1];
// a time outside the posted hours costs the fee
const offHours = (d, t) => { const w = S.book.hours[parseD(d).getDay()] || []; return !w.some(([a,b]) => a <= t && t <= b); };
const ago = iso => { const m = Math.round((Date.now() - Date.parse(iso))/60000);
  return m < 1 ? 'just now' : m < 60 ? plural(m,'minute')+' ago' : m < 60*24 ? plural(Math.round(m/60),'hour')+' ago' : plural(Math.round(m/1440),'day')+' ago'; };

async function loadRequests(){
  loadForms();
  if(DEMO){ R = {list:(S.reqs || []).filter(r => r.status!=='deleted'), loaded:true, err:''}; return; }
  if(!synced() || Y.session.dead) return;
  const since = new Date(Date.now() - 90*864e5).toISOString();
  try {
    await flushAnswers();
    const list = await api('/rest/v1/requests?select=*&order=created_at.desc&limit=300&created_at=gt.'+encodeURIComponent(since));
    // answers still waiting to go up show as already made
    list.forEach(r => { if(Y.reqq && Y.reqq[r.id]) Object.assign(r, Y.reqq[r.id]); });
    if(!DEMO) list.filter(reqTimedOut).forEach(r => answerReq(r, {status:'declined', reply:S.book.autoMsg || AUTO_MSG}));
    const before = JSON.stringify(R.list);
    R = {list:list.filter(r => r.status!=='deleted'), loaded:true, err:''};
    if(JSON.stringify(R.list) !== before) quietRender();
  } catch(e){ R.err = 'Couldn’t load requests.'; }
}
async function flushAnswers(){
  for(const id in Y.reqq || {}){
    await api('/rest/v1/requests?id=eq.'+id, {method:'PATCH', headers:{Prefer:'return=minimal'}, body:JSON.stringify(Y.reqq[id])});
    delete Y.reqq[id]; saveSync();
  }
}
function answerReq(r, fields, keepTime){
  Object.assign(r, fields, keepTime ? {} : {answered_at:new Date().toISOString()});
  if(DEMO){ saveLocal(); return; }
  const {status, reply, answered_at, stay_id, texted} = r;
  (Y.reqq ||= {})[r.id] = {status, reply, answered_at, stay_id, texted:texted!==false, answered_by:Y.session.user, hidden:!!r.hidden};
  saveSync(); flushAnswers().catch(() => {});
}

// best guess at the family: same phone, else same last name (a pet name match settles ties)
function guessFamily(r){
  const d = r.phone.replace(/\D/g,''), same = x => (x.length===7 || d.length===7) ? x.slice(-7)===d.slice(-7) : x.slice(-10)===d.slice(-10);
  let c = d.length >= 7 && S.clients.find(c => allPhones(c).some(same));
  if(c) return {c, how:'phone'};
  const last = lastName(r.name).toLowerCase(), named = S.clients.filter(c => c.name.toLowerCase()===last);
  c = named.find(c => r.pets.some(p => c.pets.some(q => q.name.toLowerCase()===p.name.trim().toLowerCase()))) || (named.length===1 && named[0]);
  return c ? {c, how:'name'} : null;
}

function fileForm(g, famId){
  const d = g.data || {}, O = d.owner || {}, snap = snapData(), prev = {status:g.status, client_id:g.client_id || null, filed_at:g.filed_at || null};
  let c = famId!=='new' && client(famId);
  if(!c){ c = fillClient({id:uid('c'), first:(O.first||'').trim(), name:(O.last||'').trim() || lastName(g.name)}); S.clients.push(c); }
  delete c.archived;
  const upd = g.mode==='update';
  const put = (obj, k, v) => { v = typeof v==='string' ? v.trim() : v; if(v && (upd || !obj[k])) obj[k] = v; };
  const tel = v => v && fmtPhone(String(v).trim());
  put(c,'first',O.first); put(c,'email',O.email); put(c,'cell',tel(O.cell)); put(c,'phone',tel(O.main)); put(c,'work',tel(O.work));
  ['city','state','zip','coName','emName','vet','pickupBy'].forEach(k => put(c, k, O[k]));
  ['coMain','coAlt','emMain','emAlt','vetPhone'].forEach(k => put(c, k, tel(O[k])));
  if(d.sign?.date && (!c.signed || c.signed < d.sign.date)) c.signed = d.sign.date;
  (d.pets || []).forEach(fp => {
    const nm = (fp.name || '').trim(); if(!nm) return;
    let p = c.pets.find(x => x.name.toLowerCase()===nm.toLowerCase());
    if(p) delete p.gone;
    if(!p){ p = newPet(nm, ['dog','cat','other'].includes(fp.species) ? fp.species : 'dog'); c.pets.push(p); }
    ['breed','color','sex','fixed','conditions','diet','food','perDay','dietNotes','treats','treatFav','jumps','bites','fights','chews','likes','dislikes'].forEach(k => put(p, k, fp[k]));
    if(/^\d{4}-\d\d-\d\d$/.test(fp.dob || '')) put(p, 'dob', fp.dob);
    if(fp.species==='other') put(p, 'other', fp.other);
    if((upd || !p.personality.length) && fp.personality?.length) p.personality = fp.personality.slice(0, 1);
    if((upd || !p.along.length) && fp.along?.length) p.along = fp.along.includes('Everyone') ? ['Everyone'] : [...fp.along];
    const note = [fp.alsoKnow, fp.notes].map(x => (x || '').trim()).filter(Boolean).join('\n');
    if(note && !(p.notes || '').includes(note)) p.notes = p.notes ? p.notes+'\n'+note : note;
    // their meds join the pet's usual care, at any clock times they wrote (else as needed, until she sets them)
    (fp.meds || []).forEach(m => { const t = [m.name, m.dose, m.freq, m.instr].map(x => (x || '').trim()).filter(Boolean).join(', ');
      if(t && !p.plan.some(x => x.tag==='meds' && x.note===t)) p.plan.push(task('meds', medTimes([m.freq, m.instr].join(' ')), t)); });
  });
  if(g.mode!=='pets') delete c.formUpdate;   // she asked for an update and got it
  saveForm(g, {status:'filed', client_id:c.id, filed_at:new Date().toISOString()});
  U.flow = {kind:'form', id:g.id, fam:c.id, stack:[{data:snap, sheet:{t:'gform', id:g.id}, prev}]};
  U.sh = {t:'client', id:c.id}; commit();
}

// Approve: make the family and pets if needed, then book one stay per kennel needed
function approveReq(r, famId){
  let c = famId!=='new' && client(famId);
  if(!c){ c = fillClient({id:uid('c'), first:firstName(r.name), name:lastName(r.name), cell:fmtPhone(r.phone), email:r.email||''}); S.clients.push(c); }
  delete c.archived;   // booking again brings an archived family back
  const ids = r.pets.map(p => {
    let q = c.pets.find(x => x.name.toLowerCase()===p.name.trim().toLowerCase());
    if(q) delete q.gone;
    if(!q){ q = newPet(p.name.trim(), p.species); q.breed = p.breed || ''; if(p.species==='other') q.other = p.kind || ''; c.pets.push(q); }
    const note = (p.note || '').trim();
    if(note && !(q.notes || '').includes(note)) q.notes = q.notes ? q.notes+'\n'+note : note;
    return q.id;
  });
  save();
  r._ids = ids;
  r._own = ids.filter((id, i) => r.pets[i].species==='other' && r.pets[i].cage!==false);   // brought their own cage
  // which pets go together: one kennel per kind when they share, else one each
  const kindOf = id => findPet(id).p.species==='dog' ? 'dog' : 'cat';   // other pets go where cats do
  // pets with the same kennel letter go together; older requests had one yes/no for sharing
  const lettered = r.pets.some(p => p.group);
  const groups = lettered ? Object.values(r.pets.reduce((m, p, i) => { (m[kindOf(ids[i])+'|'+(p.species==='other' ? 'other'+i : p.group||i)] ||= []).push(ids[i]); return m; }, {}))
    : r.share ? ['dog','cat'].map(k => ids.filter(id => kindOf(id)===k)).filter(g => g.length) : ids.map(id => [id]);
  openReqStay(r, c.id, groups, []);
}

/* ============================== SYNC ============================== */
// Local-first: this phone is the main copy and works offline. Once signed in, every
// change goes to Supabase as one small record, and changes from other phones come back.
// Safety: a phone that just signed in only downloads before it sends anything; the
// server never erases (rows are only marked deleted); a burst of deletions waits for a yes.
const SUPA = DEMO ? {url:'', key:''} : {url:'https://hmkhdmtededcxsjnlqxz.supabase.co', key:'sb_publishable_kNXTM6u_Jl95mmgBpJuzhw_bww2lCiB'};   // Project URL and anon (publishable) key. Never the service_role key.
const SKEY = KEY + '-sync';
const MASS_DELETE = 5;           // more stays than this deleted in one go (or 2+ families) are held for a yes
const syncOn = () => !!(SUPA.url && SUPA.key);
const freshSync = () => ({session:null, base:{}, pending:{}, held:null, cursor:null, ready:false});
let Y = freshSync();   // session, last synced copy of each record (base), changes waiting (pending)
try { Y = {...Y, ...JSON.parse(localStorage.getItem(SKEY))}; } catch(e) {}
const saveSync = () => { try { localStorage.setItem(SKEY, JSON.stringify(Y)); } catch(e) {} };
const SY = {busy:false, err:'', at:0};   // status for Settings; not saved
const synced = () => syncOn() && Y.session && Y.ready;

// All data as records keyed "kind:id"
function records(d){
  const r = {};
  d.clients.forEach(c => r['client:'+c.id] = c);
  d.stays.forEach(s => r['stay:'+s.id] = s);
  for(const k in d.log) r['log:'+k] = d.log[k];
  r['settings:main'] = {kennels:d.kennels, tags:d.tags, tpl:d.tpl, tplCat:d.tplCat, tplOther:d.tplOther, showFam:d.showFam, book:d.book, rates:d.rates};
  if(d.site) r['site:main'] = d.site;   // only once someone has edited the website
  return r;
}
function applyRecord(k, data){
  const i = k.indexOf(':'), kind = k.slice(0,i), id = k.slice(i+1);
  if(kind==='client' || kind==='stay'){
    const arr = kind==='client' ? S.clients : S.stays, at = arr.findIndex(x => x.id===id);
    if(data==null){ if(at>=0) arr.splice(at,1); return; }
    if(kind==='client') fillClient(data);
    at>=0 ? arr.splice(at,1,data) : arr.push(data);
  } else if(kind==='log'){ if(data==null) delete S.log[id]; else S.log[id] = data; }
  else if(kind==='site'){ if(data) S.site = data; else delete S.site; }
  else if(kind==='settings' && data){ S.kennels = data.kennels; S.tags = data.tags; S.tpl = data.tpl; if(data.showFam==null) delete S.showFam; else S.showFam = data.showFam; if(data.book) S.book = data.book; if(data.rates) S.rates = data.rates; if(data.tplCat) S.tplCat = data.tplCat; if(data.tplOther) S.tplOther = data.tplOther; }
}

// After every save: queue what changed since the last synced copy
function trackChanges(){
  if(!synced()) return;
  const at = new Date().toISOString(), cur = records(S), gone = [];
  for(const k in cur){ const j = JSON.stringify(cur[k]); if(Y.base[k] !== j){ Y.pending[k] = {data:JSON.parse(j), at}; Y.base[k] = j; } }
  for(const k in Y.base) if(!(k in cur)) gone.push(k);
  // deleting one family takes its stays with it; that's expected, so only odd bursts are held
  const famPets = new Set(gone.filter(k => k.startsWith('client:')).flatMap(k => JSON.parse(Y.base[k]).pets.map(p => p.id)));
  const famsGone = gone.filter(k => k.startsWith('client:')).length;
  const staysGone = gone.filter(k => k.startsWith('stay:') && !JSON.parse(Y.base[k]).pets.every(id => famPets.has(id))).length;
  if(famsGone > 1 || staysGone > MASS_DELETE){
    Y.held ||= {};
    gone.forEach(k => Y.held[k] = {j:Y.base[k], at});
  } else gone.forEach(k => Y.pending[k] = {deleted:true, at});
  gone.forEach(k => delete Y.base[k]);
  saveSync(); scheduleSync();
}
function heldCount(){ return Y.held ? Object.keys(Y.held).filter(k => !k.startsWith('log:')).length : 0; }
function releaseHeld(){
  const at = new Date().toISOString();
  for(const k in Y.held) Y.pending[k] = {deleted:true, at};
  Y.held = null; saveSync(); render(); syncNow();
}
function restoreHeld(){
  for(const k in Y.held){ applyRecord(k, JSON.parse(Y.held[k].j)); Y.base[k] = Y.held[k].j; }
  Y.held = null; saveLocal(); saveSync(); render();
}

async function authCall(grant, body){
  const r = await fetch(SUPA.url+'/auth/v1/token?grant_type='+grant, {method:'POST', headers:{apikey:SUPA.key, 'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw Object.assign(new Error(r.status===400 ? 'Wrong email or password.' : (j.msg || j.error_description || 'Couldn’t reach the server.')), {status:r.status});
  return {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now() + j.expires_in*1000, user:j.user.id, email:j.user.email};
}
let refreshing = null;
function freshToken(){
  if(Y.session.expires_at - 60e3 > Date.now()) return;
  return refreshing ||= authCall('refresh_token', {refresh_token:Y.session.refresh_token})
    .then(s => { Y.session = s; saveSync(); })
    .catch(e => { if(e.status >= 400 && e.status < 500){ Y.session.dead = true; saveSync(); } throw e; })
    .finally(() => { refreshing = null; });
}
async function api(path, opts={}, retried){
  await freshToken();
  const r = await fetch(SUPA.url+path, {...opts, headers:{apikey:SUPA.key, Authorization:'Bearer '+Y.session.access_token, 'Content-Type':'application/json', ...opts.headers}});
  if(r.status===401 && !retried){ Y.session.expires_at = 0; return api(path, opts, true); }   // renew the sign-in once and retry
  if(!r.ok) throw new Error('Server said '+r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
/* ---------- pet records (shot records and the like): photos or PDFs ----------
   Files go to the private "docs" storage bucket. The pet keeps a list of {id, name, kind:'img'|'pdf', at, path}.
   Removing a record only takes it off the list; the file stays in storage, like everything else.
   The demo keeps its files on the phone instead (d.data). */
const docURLs = {};   // record id -> {url, exp} once loaded, {busy} while loading, {err}
async function storage(path, opts={}, retried){
  await freshToken();
  const r = await fetch(SUPA.url+'/storage/v1/'+path, {...opts, headers:{apikey:SUPA.key, Authorization:'Bearer '+Y.session.access_token, ...opts.headers}});
  if((r.status===401 || r.status===403) && !retried){ Y.session.expires_at = 0; return storage(path, opts, true); }
  if(!r.ok) throw new Error('Server said '+r.status);
  return r.json();
}
// photos are saved as a JPEG no bigger than 2000px: a shot record stays readable and small
async function shrinkImage(file, max = 2000){
  let im;

      + (since ? '&synced_at=gt.'+encodeURIComponent(since) : ''));

    await api('/rest/v1/records', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(sent.map(([k,p]) => { const j = k.indexOf(':');

  const old = tplFor(sp), from = addDays(today(), 1), td = today();

if(DEMO){ S.reqs ||= demoRequests(); S.gforms ||= demoForms(); loadRequests(); }

if(new URLSearchParams(location.search).get('tab')==='reqs'){ U.tab = 'reqs'; history.replaceState(null, '', location.pathname); }
render();
syncNow();   // catch up with other phones as soon as the app opens

// keep the "now" line and overdue marks fresh, but not while something is open or being typed
setInterval(()=>{ const a = document.activeElement; if(!U.sh && !U.pk && !(a && /^(INPUT|TEXTAREA)$/.test(a.tagName))) render(); }, 60000);
const isTextField = el => el && (el.tagName==='TEXTAREA' || (el.tagName==='INPUT' && !/^(checkbox|radio|file|date|button)$/.test(el.type)));
document.addEventListener('focusin', e => { if(isTextField(e.target)) document.body.classList.add('typing'); });
document.addEventListener('focusout', () => setTimeout(() => { if(!isTextField(document.activeElement)){ document.body.classList.remove('typing'); if(renderLater){ renderLater = false; render(); } } }, 50));
// works offline once loaded (home-screen app)
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !U.sh && !U.pk) render();
  if(!document.hidden && R.loaded && G.loaded && !reqWaiting().length && !gNew().length) clearNotes(); });
